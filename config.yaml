# 小源 - 开源协会顾问猫娘 配置文件
# 敏感信息请通过 .env 环境变量设置

# 允许回复的群号列表 (空列表 = 允许所有群)
allowed_group_ids: ["1056259135", "1070638552"]

# 数据库文件路径
database_path: "${DATABASE_PATH:-data/xiaomo.db}"

bot:
  name: "小源"
  nickname: "小源"
  at_aliases: ["CDUT 开源协会"]
  qq_id: "3115709797"
  persona_version: 2

llm:
  provider: "mimo"
  api_base: "${LLM_API_BASE:-https://api.xiaomimimo.com/v1}"
  api_key: "${LLM_API_KEY:-}"
  model: "${LLM_MODEL:-mimo-v2.5}"
  max_tokens: 4096
  temperature: 0.75
  timeout_seconds: 30
  max_retries: 0

vision:
  provider: "mimo"
  api_base: "${VISION_API_BASE:-https://api.xiaomimimo.com/v1}"
  anthropic_base: "${VISION_ANTHROPIC_BASE:-https://api.xiaomimimo.com/anthropic}"
  api_key: "${VISION_API_KEY:-}"
  model: "${VISION_MODEL:-mimo-v2.5}"
  max_tokens: 384
  temperature: 0.1
  timeout_seconds: 25
  download_timeout_seconds: 12
  total_timeout_seconds: 30
  max_retries: 0
  max_images_per_turn: 2
  max_image_size_mb: 20

weather:
  target_group: "1056259135"
  city: "成都"

# 联网搜索 (Tavily Search API)
web_search:
  api_key: "${TAVILY_API_KEY:-}"
  max_results: 5
  search_depth: "basic"        # basic | advanced
  include_answer: true         # 包含 AI 答案摘要
  natural_query: true          # 自动检测自然语言问句并搜索
  timeout_seconds: 8           # 搜索超时就先回复，不长期卡住群聊

# 主动发言（非 @、非叫小源的自动消息）
proactive:
  ai_gate_enabled: true        # 主动发言前先让 LLM 判断是否合适
  ai_gate_timeout_seconds: 20  # AI 判断超时则跳过这次主动发言
  quiet_hours:
    enabled: true
    start_hour: 23             # 23:00 后不主动发言
    end_hour: 7                # 07:00 前不主动发言

# 主动插话机会评分（非 @ 时只在合适空位短接一句）
proactive_join:
  enabled: true
  min_cooldown_seconds: 90
  window_seconds: 0.9
  recent_context_messages: 8
  local_reactions_enabled: true
  post_check:
    enabled: true
    stale_seconds: 55
    cancel_after_human_messages: 8
    cancel_if_bot_spoke: true
  probability:
    react: 0.55
    short_reply: 0.82
    helpful_reply: 0.95

# 发送节奏：模拟打字时间，显式 @ 保持快，主动插话保持短
human_timing:
  enabled: true
  chars_per_second: 22
  jitter_seconds: 0.45
  min_seconds: 0.15
  max_seconds: 3.0
  explicit_max_seconds: 0.8
  proactive_max_seconds: 1.2

# QQ 桥接未在时限内确认发送时立即释放回复管线；结果不确定，因此不会自动重发。
delivery:
  send_timeout_seconds: 12

# 群友戳机器人后的短回复：直接互动会回应，但群里连续戳时保持克制。
poke_reply:
  enabled: true
  group_cooldown_seconds: 360
  user_cooldown_seconds: 600
  after_bot_reply_seconds: 45

# 类人化回复策略（显式 @ 或叫小源后的正式回复前置判断）
humanize:
  enabled: true
  strategy_llm_for_explicit: false # 明确 @/to_me 不额外调用策略 LLM，保证响应速度
  strategy_llm_for_proactive: false # 主动接话由正式回复模型一次完成“判断+作答”
  explicit_max_delay_seconds: 0.3 # 明确 @ 后最多只额外等 0.3 秒再开始请求 LLM
  proactive_strategy_max_delay_seconds: 0.4 # 主动接话已另有打字延迟，策略层不再长时间等待
  proactive_fallback_max_delay_seconds: 0.2
  strategy_timeout_seconds: 12  # 策略判断超时则走本地回退策略
  max_extra_delay_seconds: 5    # 策略允许添加的最大额外等待

memory:
  weight_half_life_minutes: 60
  max_context_tokens: 8000
  scene_context_tokens:
    social_ack: 2400
    casual_banter: 3600
    casual_question: 4000
    personal_share: 4200
    group_flow: 4600
    image_question: 4600
    support: 5200
  compress_threshold_tokens: 15000
  keep_recent_messages: 50

# 向量语义记忆
vector:
  model: "BAAI/bge-small-zh-v1.5"
  search_results: 10

silent_window:
  private_seconds: 3
  group_seconds: 5
  explicit_group_seconds: 0.8    # 明确 @/to_me 的快速响应窗口；普通群聊仍保留 5 秒合并

# 连续对话：第一次 @/点名建立会话，后续同一成员可不重复 @。
# 本地规则只筛候选，正式回复模型仍会结合群聊背景判断是在对小源还是对群友说话。
conversation_followup:
  enabled: true
  timeout_seconds: 240
  pending_seconds: 15
  window_seconds: 0.9
  recent_context_messages: 10
  max_intervening_human_messages: 2
  post_check:
    enabled: true
    stale_seconds: 45
    cancel_after_human_messages: 2

auto_action:
  bubble_inactive_minutes: 30
  bubble_max_inactive_minutes: 180
  bubble_cooldown_minutes: 60
  bubble_attempt_cooldown_minutes: 15
  repeat_threshold: 3
  repeat_cooldown_minutes: 30

output:
  max_chars_per_message: 800
  max_code_lines: 50

safety:
  enabled: true
  blocklist_file: "data/blocklist.txt"

# 自动戳戳：特定成员说话时主动戳
# match_by: "qq" 按 QQ 号精确匹配；"nickname" 按 QQ 昵称包含匹配（大小写不敏感）
# cooldown_minutes: 同一目标两次戳的最小间隔
auto_poke_targets:
  - name: "文姐"        # QQ 昵称中包含"文姐"即匹配
    match_by: "nickname"
    cooldown_minutes: 5
  - name: "1458741024"  # reason 本人
    match_by: "qq"
    cooldown_minutes: 5

# 通用戳戳：关闭，避免每位群友首次发言都占用一次 AI 审批并干扰文字接话
poke_everyone_cooldown_minutes: 0

# 主动戳戳：遇到感兴趣的话题时戳一下发言者
poke_topic:
  probability: 0.20          # 每次检测到有趣话题时触发戳戳的概率
  user_cooldown_hours: 6.0   # 同一群友至少隔 N 小时才能再戳
  group_cooldown_seconds: 300  # 同群两次戳戳至少隔 N 秒

# 弔图语录 / 关键词反应
